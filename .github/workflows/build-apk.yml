
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No project ZIP found"
            exit 1
          fi
          unzip -o "$ZIP" -d extracted
          find extracted -name settings.gradle -o -name settings.gradle.kts

      - name: Locate Android project
        run: |
          ROOT=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)
          if [ -z "$ROOT" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MineManagement-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
